<div title="{{xsMode ? ('assignHandlePid-help' | translate) : ''}}">
  <h2 data-translate="" data-ng-hide="xsMode">assignHandlePid</h2>
  <div data-ng-hide="xsMode" class="text-muted" data-translate="">
    assignHandlePid-help
  </div>

  <div class="form-inline" data-ng-class="{'form-inline-sm': xsMode}">
    <div class="form-group">
      <label class="control-label" for="gn-handle-url">{{'handleTargetUrl' | translate}}</label>
      <input
        id="gn-handle-url"
        type="text"
        class="form-control"
        data-ng-model="handleUrl"
        placeholder="{{'handleTargetUrl' | translate}}"
      />
    </div>

    <div class="checkbox" style="margin-left: 10px;">
      <label>
        <input type="checkbox" data-ng-model="includeAdmin" />
        {{'handleIncludeAdmin' | translate}}
      </label>
    </div>

    <button
      class="btn btn-primary"
      data-ng-disabled="!handleUrl"
      data-gn-click-and-spin="assign()"
    >
      <i class="fa fa-fw fa-share-square-o"></i>
      <span data-translate="">handleAssignAction</span>
    </button>
  </div>

  <div
    data-ng-if="response.assign"
    data-ng-class="{'text-danger': response.assign.status !== 201, 'text-success': response.assign.status === 201}"
  >
    <span data-ng-if="response.assign.status === 201" data-translate="">handleAssignSuccess</span>
    <span data-ng-if="response.assign.status !== 201">{{response.assign.data.description || response.assign.statusText}}</span>
  </div>
</div>
